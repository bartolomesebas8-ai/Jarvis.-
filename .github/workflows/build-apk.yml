name: Construir APK de JARVIS 0.2

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extraer y verificar JARVIS 0.2
        shell: bash
        run: |
          set -euo pipefail

          ZIP="JARVIS-fuente-0.2.zip"

          if [ ! -f "$ZIP" ]; then
            echo "No se encontró el proyecto nuevo"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          PROJECT_DIR="extracted/JARVIS-Android"

          test -f "$PROJECT_DIR/settings.gradle.kts"

          SOURCE="$PROJECT_DIR/app/src/main/java/com/jarvis/assistant/MainActivity.kt"

          grep -q 'Memoria local activada' "$SOURCE"
          grep -q 'Versión 0.2 · Memoria local' "$SOURCE"
          grep -q 'versionName="0.2"' "$PROJECT_DIR/app/build.gradle.kts"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "JARVIS 0.2 verificado"

      - name: Configurar Java y Kotlin
        shell: bash
        run: |
          python3 - "$PROJECT_DIR/app/build.gradle.kts" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          s = s.replace(
              'android {',
              '''android {
                  compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                  }
                  kotlinOptions {
                      jvmTarget = "17"
                  }''',
              1
          )

          p.write_text(s)
          PY

      - name: Construir APK
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-0.2-debug
          path: extracted/JARVIS-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
