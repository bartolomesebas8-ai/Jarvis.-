name: Construir APK de JARVIS

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extraer proyecto actualizado
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 2 -type f -name 'JARVIS-listo-para-subir (1).zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            ZIP="$(find . -maxdepth 2 -type f -name 'JARVIS-listo-para-subir.zip' -print -quit)"
          fi
          if [ -z "$ZIP" ]; then
            echo "No se encontró el ZIP de JARVIS"
            exit 1
          fi
          echo "Usando: $ZIP"
          mkdir extracted
          unzip -o "$ZIP" -d extracted
          PROJECT_DIR="$(find extracted -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configurar Java y Kotlin
        shell: bash
        run: |
          python3 - "$PROJECT_DIR/app/build.gradle.kts" <<'PY'
          import sys
          from pathlib import Path
          p = Path(sys.argv[1])
          s = p.read_text()
          s = s.replace('android {', '''android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }''', 1)
          p.write_text(s)
          PY

      - name: Construir APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
