name: Inspeccionar proyecto JARVIS 0.3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer y guardar archivos de la app
        shell: bash
        run: |
          set -euo pipefail
          ZIP="JARVIS-0.3-motores.zip"
          test -f "$ZIP"
          mkdir -p extracted .inspection/JARVIS-0.3
          unzip -q "$ZIP" -d extracted
          PROJECT="extracted/JARVIS-Android"
          MAIN="$PROJECT/app/src/main"
          test -d "$MAIN"
          cp -R "$MAIN/java" .inspection/JARVIS-0.3/
          if [ -d "$MAIN/res" ]; then cp -R "$MAIN/res" .inspection/JARVIS-0.3/; fi
          if [ -f "$MAIN/AndroidManifest.xml" ]; then cp "$MAIN/AndroidManifest.xml" .inspection/JARVIS-0.3/; fi
          find .inspection/JARVIS-0.3 -type f | sort > .inspection/JARVIS-0.3/archivos.txt
          echo "Archivos de código y recursos preparados:"
          cat .inspection/JARVIS-0.3/archivos.txt

      - name: Guardar informe en GitHub para revisión
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .inspection/JARVIS-0.3
          if git diff --cached --quiet; then
            echo "El informe ya estaba actualizado."
          else
            git commit -m "Guardar informe de inspección JARVIS 0.3"
            git push
          fi
