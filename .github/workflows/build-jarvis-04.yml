name: Construir APK de JARVIS 3.13

on:
  workflow_dispatch:
  push:
    paths:
      - "JARVIS-Android-0.4/**"
      - ".github/workflows/build-jarvis-04.yml"
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Preparar Python para Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Preparar Android SDK, NDK y CMake
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;29.0.13113456 cmake;3.31.6"
      - name: Incorporar modelo local de JARVIS en el APK
        run: |
          mkdir -p JARVIS-Android-0.4/app/src/main/assets
          curl --fail --location --retry 4 --retry-delay 5 \
            "https://huggingface.co/ggml-org/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf" \
            --output JARVIS-Android-0.4/app/src/main/assets/jarvis-model.gguf
          size=$(stat -c%s JARVIS-Android-0.4/app/src/main/assets/jarvis-model.gguf)
          test "$size" -ge 1000000000
          test "$size" -le 2000000000
      - name: Construir APK
        run: gradle -p JARVIS-Android-0.4 :app:assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-3.13-debug
          path: JARVIS-Android-0.4/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
